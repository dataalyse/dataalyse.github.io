    <text x="442" y="320">Outros</text><text x="588" y="320" text-anchor="end" fill="#8A8DA8">10%</text>
    <rect x="442" y="325" width="146" height="6" rx="2" fill="#F1EFFD"/><rect x="442" y="325" width="43" height="6" rx="2" fill="#6D2DFC" opacity=".4"/>
