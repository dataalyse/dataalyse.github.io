  <rect x="180" y="228" width="180" height="24" rx="3" fill="#6D2DFC" opacity=".8"/>
  <rect x="180" y="262" width="95" height="24" rx="3" fill="#6D2DFC" opacity=".55"/>
  <rect x="180" y="296" width="57" height="24" rx="3" fill="#E91CC0"/>
