<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Dashboard de agência de turismo (dados demonstrativos)</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4C58F0"/><stop offset=".55" stop-color="#6D2DFC"/><stop offset="1" stop-color="#E91CC0"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6D2DFC" stop-opacity=".2"/><stop offset="1" stop-color="#6D2DFC" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="640" height="400" fill="#F6F7FB"/>
  <rect x="24.5" y="24.5" width="591" height="351" rx="8" fill="#fff" stroke="#E4E6F0"/>
  <path d="M32 24h36v352H32a8 8 0 0 1-8-8V32a8 8 0 0 1 8-8z" fill="#0B0D2A"/>
  <rect x="36" y="38" width="20" height="20" rx="5" fill="url(#g)"/>
  <rect x="38" y="80" width="16" height="16" rx="4" fill="#fff" opacity=".14"/>
  <rect x="38" y="106" width="16" height="16" rx="4" fill="#8B5CFF"/>
