    <rect x="442" y="205" width="146" height="6" rx="2" fill="#F1EFFD"/><rect x="442" y="205" width="146" height="6" rx="2" fill="url(#g)"/>
    <text x="442" y="230">Serra Gaúcha</text><text x="588" y="230" text-anchor="end" fill="#8A8DA8">22%</text>
    <rect x="442" y="235" width="146" height="6" rx="2" fill="#F1EFFD"/><rect x="442" y="235" width="94" height="6" rx="2" fill="#6D2DFC"/>
    <text x="442" y="260">Internacional</text><text x="588" y="260" text-anchor="end" fill="#8A8DA8">19%</text>
    <rect x="442" y="265" width="146" height="6" rx="2" fill="#F1EFFD"/><rect x="442" y="265" width="82" height="6" rx="2" fill="#6D2DFC" opacity=".75"/>
    <text x="442" y="290">Costa Verde</text><text x="588" y="290" text-anchor="end" fill="#8A8DA8">15%</text>
