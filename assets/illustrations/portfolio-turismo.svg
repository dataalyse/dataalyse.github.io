    <text x="587" y="103" text-anchor="end" font-size="9" fill="#1F7A55">+5%</text>
  </g>

  <rect x="88.5" y="156.5" width="330" height="204" rx="6" fill="#fff" stroke="#E4E6F0"/>
  <text x="100" y="177" font-size="10.5" font-weight="600" fill="#14172E">Funil de orçamentos</text>
  <g font-size="9" fill="#4A4E6B">
