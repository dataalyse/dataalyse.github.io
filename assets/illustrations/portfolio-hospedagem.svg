  <text x="406" y="177" text-anchor="end" font-size="8.5" fill="#E91CC0">— média 69%</text>

  <rect x="430.5" y="156.5" width="170" height="204" rx="6" fill="#fff" stroke="#E4E6F0"/>
  <text x="442" y="177" font-size="10.5" font-weight="600" fill="#14172E">Receita por canal</text>
  <g transform="rotate(-90 515 244)" fill="none" stroke-width="15">
