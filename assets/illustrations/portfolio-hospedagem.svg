    <rect x="219.5" y="84.5" width="118" height="58" rx="6" fill="#fff" stroke="#E4E6F0"/>
    <text x="231" y="103" fill="#8A8DA8">Diária média</text>
    <text x="231" y="128" font-size="18" font-weight="600" fill="#14172E">R$ 342</text>
    <text x="325" y="128" text-anchor="end" font-size="9" fill="#1F7A55">+4,8%</text>

    <rect x="350.5" y="84.5" width="118" height="58" rx="6" fill="#fff" stroke="#E4E6F0"/>
