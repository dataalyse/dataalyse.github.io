    <circle cx="515" cy="244" r="42" stroke="#4C58F0" stroke-dasharray="71.3 263.9" stroke-dashoffset="-100.3"/>
    <circle cx="515" cy="244" r="42" stroke="#E91CC0" stroke-dasharray="58.1 263.9" stroke-dashoffset="-171.6"/>
